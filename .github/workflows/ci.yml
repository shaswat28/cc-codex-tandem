name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # A broken manifest means users cannot install the plugin, so the real
      # validator runs here even though the test skips when it is absent.
      - name: Set up Node for plugin validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install plugin validator
        run: npm install --global @anthropic-ai/claude-code

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: make cov
